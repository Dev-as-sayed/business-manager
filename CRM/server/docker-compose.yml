services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: s_omnia_user
      POSTGRES_PASSWORD: StrongPassword123!
      POSTGRES_DB: s_omnia_db
    ports:
      - '5433:5432'
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U s_omnia_user -d s_omnia_db']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crm-postgres-data:
