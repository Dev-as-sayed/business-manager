name: manifest-crm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      target: build
    restart: 'no'
    env_file: ./deploy/.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'prisma', 'migrate', 'deploy']

  bootstrap:
    profiles: ['tools']
    build:
      context: ./server
      target: build
    restart: 'no'
    env_file: ./deploy/.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: ['npx', 'tsx', 'prisma/bootstrap.ts']

  api:
    build:
      context: ./server
      target: runtime
    restart: unless-stopped
    env_file: ./deploy/.env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - '4000'

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: /api/v1
        VITE_APP_NAME: Manifest CRM
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
